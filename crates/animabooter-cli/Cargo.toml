[package]
name = "animabooter-cli"
version = "0.2.0"
description = "Command-line interface for AnimaBooter"
authors = ["marrionesa"]
license = "MIT"
repository = "https://github.com/marrionesa/animabooter"
homepage = "https://github.com/marrionesa/animabooter"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "animabooter"
path = "src/main.rs"

[dependencies]
animabooter-core = { version = "0.2.0", path = "../animabooter-core" }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
serde_json = "1"