# Prepared but INERT: this workflow only runs if the repository is published
# manually by the owner. Until then it never executes anywhere.

name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["**"]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test
      - name: Frontend checks
        run: |
          bun install
          bun run check
          bun run build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests (windows backend compiles + core suites)
        working-directory: src-tauri
        run: cargo test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests (macos backend compiles + core suites)
        working-directory: src-tauri
        run: cargo test
