# CI manual.
# No se ejecuta automáticamente con git push ni pull request.
# Ejecutar desde GitHub Actions mediante "Run workflow".

name: ci

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release a publicar"
        required: true
        default: "v0.2.0"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Enable pnpm
        run: corepack enable

      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test

      - name: Frontend checks
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build

      - name: Build Linux bundle
        run: |
          pnpm tauri build --target x86_64-unknown-linux-gnu

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: animabooter-linux
          path: target/x86_64-unknown-linux-gnu/release/bundle/**/*
          retention-days: 14

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Enable pnpm
        run: corepack enable

      - name: Build Windows bundle
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --target x86_64-pc-windows-msvc

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: animabooter-windows
          path: target/x86_64-pc-windows-msvc/release/bundle/**/*
          retention-days: 14

  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Enable pnpm
        run: corepack enable

      - name: Build macOS bundle
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --target aarch64-apple-darwin

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: animabooter-macos
          path: target/aarch64-apple-darwin/release/bundle/**/*
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - linux
      - windows
      - macos

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-upload

      - name: Flatten assets
        run: |
          mkdir -p assets
          # Only real installers, prefixed with the platform to avoid
          # name collisions between bundles (icons etc. are dropped).
          find release-upload -type f -regex '.*\.\(exe\|msi\|dmg\|deb\|rpm\|AppImage\|AppImage\.tar\.gz\)' | while read -r f; do
            platform=$(echo "$f" | cut -d/ -f2)
            cp -v "$f" "assets/${platform}_$(basename "$f")"
          done
          ls -la assets/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e

          REPO="marrionesa/animabooter"
          echo "Publishing release: $TAG"

          if gh release view -R "$REPO" "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            echo "Uploading assets..."
            gh release upload -R "$REPO" "$TAG" assets/* --clobber
          else
            echo "Release $TAG does not exist."
            echo "Creating release..."
            gh release create -R "$REPO" "$TAG" assets/* \
              --title "AnimaBooter $TAG" \
              --generate-notes
          fi