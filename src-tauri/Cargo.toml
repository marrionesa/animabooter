[package]
name = "animabooter"
version = "0.2.0"
description = "Flash USB drives with soul — a tiny, honest, cross-platform USB imager"
authors = ["marrionesa"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "animabooter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies.animabooter-core]
path = "../crates/animabooter-core"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
